<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <rect width="320" height="320" fill="#ffffff"/>
  <g fill="none" stroke="#e7e5e4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- wrench -->
    <g transform="translate(20 20) rotate(-15)">
      <path d="M19 3 a6 6 0 0 0-6 6 l-9 9 4 4 9-9 a6 6 0 0 0 6-6 l-2 2-3-3 z"/>
    </g>
    <!-- hammer -->
    <g transform="translate(150 30) rotate(20)">
      <rect x="6" y="2" width="18" height="9" rx="1.5"/>
      <rect x="12" y="11" width="6" height="22" rx="1"/>
    </g>
    <!-- screwdriver -->
    <g transform="translate(250 15) rotate(45)">
      <rect x="9" y="2" width="6" height="14" rx="1"/>
      <rect x="6" y="16" width="12" height="18" rx="2"/>
    </g>
    <!-- paint roller -->
    <g transform="translate(30 140) rotate(10)">
      <rect x="3" y="3" width="22" height="9" rx="1.5"/>
      <rect x="12" y="12" width="4" height="6"/>
      <rect x="10" y="18" width="8" height="14" rx="1"/>
    </g>
    <!-- measuring tape -->
    <g transform="translate(140 150) rotate(-8)">
      <circle cx="14" cy="14" r="11"/>
      <circle cx="14" cy="14" r="4"/>
      <path d="M14 3 v6 M25 14 h-6 M14 25 v-6 M3 14 h6"/>
    </g>
    <!-- saw -->
    <g transform="translate(240 140) rotate(15)">
      <path d="M2 8 h26 l-2 4 h-22 z"/>
      <path d="M4 12 l1 3 M8 12 l1 3 M12 12 l1 3 M16 12 l1 3 M20 12 l1 3 M24 12 l1 3"/>
    </g>
    <!-- pliers -->
    <g transform="translate(20 250) rotate(25)">
      <path d="M4 4 l8 8 4-4 8 8 M12 12 l-4 8 M16 16 l4 8"/>
      <circle cx="5" cy="5" r="2"/>
    </g>
    <!-- drill -->
    <g transform="translate(140 260) rotate(-12)">
      <rect x="3" y="6" width="16" height="10" rx="2"/>
      <rect x="19" y="9" width="8" height="3"/>
      <rect x="6" y="16" width="10" height="8" rx="1"/>
    </g>
    <!-- nut/bolt -->
    <g transform="translate(250 255) rotate(30)">
      <polygon points="14,2 24,8 24,20 14,26 4,20 4,8"/>
      <circle cx="14" cy="14" r="5"/>
    </g>
  </g>
</svg>
